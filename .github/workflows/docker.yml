name: Test und Docker-Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # wie Debian trixie
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: shellcheck (Einrichtungsskript und eingebetteter Starter)
        run: |
          shellcheck client/vmdash-rdp-setup.sh
          awk "/<< 'EOF'/{f=1;next} /^EOF\$/{f=0} f" client/vmdash-rdp-setup.sh > "$RUNNER_TEMP/vmdash-rdp-open"
          shellcheck "$RUNNER_TEMP/vmdash-rdp-open"

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kurzer Commit-Hash
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.sha.outputs.short }}
          tags: |
            ghcr.io/maxkhl/vmdash:latest
            ghcr.io/maxkhl/vmdash:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
