# Nginx Proxy Manager auf maxmedia, Proxy-Host rdpgw.maxkhl.com
#   Ziel:        http://<maxwork-ip>:8443
#   Details:     "Websockets Support" AN  (setzt Upgrade-/Connection-Header und HTTP/1.1)
#   SSL:         Zertifikat wie üblich, "HTTP/2 Support" AUS
#   Advanced:    der folgende Block
#
# rdpgw braucht den Websocket-Transport des RD Gateways. Puffern, Request-Buffering
# und Chunked-Encoding stören den Datenstrom; die Timeouts halten lange Sitzungen offen.

proxy_buffering off;
proxy_request_buffering off;
chunked_transfer_encoding off;
proxy_connect_timeout 60s;
proxy_read_timeout 1d;
proxy_send_timeout 1d;
